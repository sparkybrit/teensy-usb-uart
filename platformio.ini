; USB-UART adapter firmware for the Teensy 2.0 (ATmega32U4), built on LUFA.
; No Arduino/Teensyduino framework: this is a bare avr-gcc build of src/ plus the
; LUFA library vendored in lib/LUFA.
;
; Build:   ~/.platformio/penv/bin/pio run
; Upload:  ~/.platformio/penv/bin/pio run -t upload   then press the Teensy's button
; Other env: add  -e teensy2_flowctl

[platformio]
default_envs = teensy2

[env]
; PlatformIO's own teensy platform crashes on a Teensy 2.0 build without a framework
; (platform-teensy 5.0.0, KeyError 'toolchain-gccarmnoneeabi'), so this uses the
; atmelavr platform with the board defined in boards/teensy2_bare.json.
platform = atmelavr
board = teensy2_bare
platform_packages = platformio/tool-teensy
lib_deps = LUFA
build_flags =
    -std=gnu99
    -DARCH=ARCH_AVR8
    -DF_USB=16000000UL
    -DUSE_LUFA_CONFIG_HEADER
    -I${PROJECT_DIR}/include
    -fshort-enums
    -fpack-struct
    -fno-strict-aliasing
    -funsigned-char
    -funsigned-bitfields
    -Wl,--relax

; PJRC's command line loader, waiting (-w) for the Teensy's HalfKay bootloader,
; which the button on the board starts.
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-teensy/teensy_loader_cli -mmcu=atmega32u4 -w -v $SOURCE

; Plain bridge, no flow control: TX and RX only.
[env:teensy2]

; RTS/CTS hardware flow control on the 32U4's own USART1 pins: CTS = PD5, RTS = PB7.
[env:teensy2_flowctl]
build_flags =
    ${env.build_flags}
    -DHW_FLOW_CONTROL
